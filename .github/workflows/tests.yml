name: Demo validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python run.py --no-images --output /tmp/verified-demos
      - name: Compare executed evidence to published reports
        run: |
          diff -u reports/data-audit/results.json /tmp/verified-demos/data-audit/results.json
          diff -u reports/execution-gap/results.json /tmp/verified-demos/execution-gap/results.json
          diff -u reports/multi-account-bot/results.json /tmp/verified-demos/multi-account-bot/results.json
          diff -u reports/order-repeat/results.json /tmp/verified-demos/order-repeat/results.json
          diff -u reports/strategy-trial/results.json /tmp/verified-demos/strategy-trial/results.json
          diff -u reports/history-collector/results.json /tmp/verified-demos/history-collector/results.json
      - name: Execute demand-led solution checks
        run: python run_demand_solutions.py --no-images --output /tmp/demand-solutions
      - name: Verify deterministic analysis and API evidence
        run: |
          diff -u reports/analysis-review/results.json /tmp/demand-solutions/analysis-review/results.json
          diff -u reports/calculation-boundary/results.json /tmp/demand-solutions/calculation-boundary/results.json
